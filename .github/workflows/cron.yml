name: cron

on:
    schedule:
        # 注意：GitHub 不执行 fork 上的 schedule 触发器，这一条在本仓库是装饰。
        # 实际拉起跑的是 workflow_dispatch（由 s5.861996.xyz 的 Worker Cron Trigger 每 3 小时调一次）。
        - cron: '0 */3 * * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: cron
    cancel-in-progress: false

# 上游 runoneall/free-socks5-proxy-api 自己带 schedule 且在真的跑（不是 fork），
# 所以这里不再重复扫一遍全网：只把它按国家分好的 socks5 池镜像过来当兜底源。
# 上游改了路径或被删时，已提交的文件保持不动——宁可用旧数据，也不把兜底源清空。
jobs:
    mirror:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: mirror per-country pools
              run: |
                  set -e
                  mkdir -p data
                  for cc in HK TW JP KR SG US DE RU; do
                      url="https://cdn.jsdelivr.net/gh/runoneall/free-socks5-proxy-api@main/data/$cc.txt"
                      if curl -fsSL --max-time 60 "$url" -o "/tmp/$cc.txt" && [ -s "/tmp/$cc.txt" ]; then
                          mv "/tmp/$cc.txt" "data/$cc.txt"
                          echo "$cc  $(wc -l < "data/$cc.txt") 条"
                      else
                          echo "$cc  上游取不到，保留现有文件"
                      fi
                  done

            - name: rebuild all.txt
              run: |
                  set -e
                  : > data/all.txt
                  for cc in HK TW JP KR SG US DE RU; do
                      [ -s "data/$cc.txt" ] || continue
                      awk -v c="$cc" '/socks5:\/\// { print c "|" $0 }' "data/$cc.txt" >> data/all.txt
                  done
                  wc -l data/all.txt

            - name: get time
              run: echo "RUN_TIME=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

            - name: write last run time
              run: echo "${{ env.RUN_TIME }}" > last_run_time.txt

            - name: commit and push changes
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add data last_run_time.txt
                  git commit -m "${{ env.RUN_TIME }}" || echo "nothing to commit"
                  git push
